# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: BanForge

gitlab_urls:
  api: https://git.d3m0k1d.ru/api/v4
  download: https://git.d3m0k1d.ru/d3m0k1d/banforge/-/releases
  skip_tls_verify: false

builds:
  - id: banforge
    main: ./cmd/banforge/main.go
    binary: banforge
    ignore:
      - goos: windows
      - goos: darwin
      - goos: freebsd
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w"
    env:
      - CGO_ENABLED=0

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: banforge
    package_name: banforge
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://git.d3m0k1d.ru/d3m0k1d/banforge
    description: BanForge IPS log-based system
    maintainer: d3m0k1d <contact@d3m0k1d.ru>
    license: GPLv3.0
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    scripts:
      postinstall: build/postinstall.sh
      postremove: build/postremove.sh
    contents:
      - src: docs/man/banforge.1
        dst: /usr/share/man/man1/banforge.1
        file_info:
          mode: 0644
      - src: docs/man/banforge.5
        dst: /usr/share/man/man5/banforge.5
        file_info:
          mode: 0644

release:
  gitlab:
    owner: d3m0k1d
    name: banforge
  mode: keep-existing

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]
