stages:
  - lint
  - build
  - test
  - release

variables:
  GIT_DEPTH: "0"

lint:
  stage: lint
  image: golangci/golangci-lint:latest
  needs: []
  script:
    - golangci-lint run

build:
  stage: build
  image: golang:latest
  needs: []
  script:
    - go mod download
    - go build ./...
    - go build -o banforge ./cmd/banforge
    - ./banforge version
  artifacts:
    paths:
      - banforge
    expire_in: 1 week

test:
  stage: test
  image: golang:latest
  needs: []
  script:
    - go mod download
    - go vet ./...
    - go test -race ./...

release:github:
  stage: release
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  needs:
    - lint
    - build
    - test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  before_script:
    - apk add --no-cache syft gnupg
    - |
      if [ -n "${GPG_PRIVATE_KEY_BASE64:-}" ]; then
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
      fi
  script:
    - test -n "$GITHUB_TOKEN"
    - goreleaser check --config .goreleaser.yml
    - goreleaser release --clean --config .goreleaser.yml

release:gitlab:
  stage: release
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  needs:
    - lint
    - build
    - test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/'
  before_script:
    - apk add --no-cache syft gnupg
    - |
      if [ -n "${GPG_PRIVATE_KEY_BASE64:-}" ]; then
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
      fi
  script:
    - test -n "$GITLAB_TOKEN"
    - goreleaser check --config .goreleaser.gitlab.yml
    - goreleaser release --clean --config .goreleaser.gitlab.yml
